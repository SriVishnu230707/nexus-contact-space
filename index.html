<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Nexus — a refined 3D contact workspace.">
  <title>Nexus — 3D Contact Space</title>
  <style>
    :root{--ink:#132039;--muted:#69758d;--line:#e7eaf1;--paper:rgba(255,255,255,.74);--violet:#6657e8;--cyan:#18bccc;--coral:#ff765f;--shadow:0 24px 70px rgba(32,42,77,.13)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:500 15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7fb;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 8% 10%,rgba(126,231,240,.32),transparent 27%),radial-gradient(circle at 90% 24%,rgba(148,126,255,.24),transparent 31%),linear-gradient(135deg,#fbfcff,#f3f2fa)}body:after{content:"";position:fixed;inset:0;z-index:-1;opacity:.36;background-image:radial-gradient(#aeb5c5 .7px,transparent .7px);background-size:21px 21px;mask-image:linear-gradient(90deg,black,transparent 78%)}
    button,input{font:inherit}.shell{width:min(1180px,calc(100% - 36px));margin:auto}.nav{height:82px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.025em}.logo{width:33px;aspect-ratio:1;border-radius:12px;background:linear-gradient(145deg,#978bff,var(--violet));box-shadow:0 10px 25px rgba(102,87,232,.28);position:relative;transform:rotate(-7deg)}.logo:after{content:"";position:absolute;inset:9px;border:2px solid white;border-radius:50%}.status{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.62);color:var(--muted);font-size:13px;box-shadow:0 8px 26px rgba(30,42,80,.05)}.status:before{content:"";display:inline-block;width:7px;aspect-ratio:1;border-radius:50%;margin-right:7px;background:#29bf75;box-shadow:0 0 10px #29bf7588}.status.offline:before{background:#ef8c4f;box-shadow:none}
    .hero{padding:58px 0 66px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:40px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;color:var(--violet);font-weight:850;font-size:11px}.hero h1{font-size:clamp(52px,6.8vw,88px);line-height:.94;letter-spacing:-.075em;margin:18px 0}.hero h1 span{color:var(--violet)}.hero p{font-size:18px;color:var(--muted);max-width:590px}.search{display:flex;gap:10px;margin-top:28px;padding:7px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.7);box-shadow:var(--shadow);max-width:540px}.search input{flex:1;border:0;outline:0;background:transparent;padding:9px 12px;color:var(--ink)}.search button,.add{border:0;border-radius:12px;padding:12px 17px;color:#fff;background:linear-gradient(135deg,#8072f4,var(--violet));font-weight:800;cursor:pointer;box-shadow:0 11px 24px rgba(102,87,232,.23)}
    .universe{height:440px;position:relative;display:grid;place-items:center;perspective:900px}.sphere{width:230px;aspect-ratio:1;border-radius:50%;position:relative;transform-style:preserve-3d;background:radial-gradient(circle at 31% 24%,#fff 0 3%,#baffff 9%,#88dfe9 22%,#8274ed 60%,#3a2e98 100%);box-shadow:inset -35px -36px 62px rgba(39,29,128,.46),0 36px 60px rgba(68,55,177,.22);animation:float 5.5s ease-in-out infinite}.orbit{position:absolute;inset:-32%;border:1.5px solid rgba(102,87,232,.35);border-radius:50%;transform:rotateX(67deg) rotateZ(-18deg)}.avatar{position:absolute;width:52px;aspect-ratio:1;border-radius:18px;border:4px solid rgba(255,255,255,.85);box-shadow:0 16px 30px rgba(53,55,102,.22);display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px}.a1{background:#ff8e77;left:-30%;top:2%;transform:translateZ(60px)}.a2{background:#2dbfce;right:-38%;top:38%;transform:translateZ(90px)}.a3{background:#8477ef;left:-20%;bottom:-8%;transform:translateZ(110px)}.tag{position:absolute;right:-44%;top:4%;padding:12px 15px;border:1px solid rgba(255,255,255,.8);border-radius:15px;background:rgba(255,255,255,.68);backdrop-filter:blur(16px);box-shadow:var(--shadow);font-size:12px;color:var(--muted)}.tag strong{display:block;color:var(--ink);font-size:17px}
    .workspace{padding:10px 0 80px;display:grid;grid-template-columns:330px 1fr;gap:18px}.panel{background:var(--paper);border:1px solid rgba(255,255,255,.9);border-radius:25px;padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(20px)}.panel h2{margin:0 0 17px;font-size:18px;letter-spacing:-.03em}.form{display:grid;gap:10px}.form input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;outline:0}.form input:focus{border-color:#a79df5;box-shadow:0 0 0 4px rgba(102,87,232,.09)}.add{margin-top:3px}.contacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:45px}.person{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);background:rgba(255,255,255,.82);border-radius:17px;transition:.25s}.person:hover{transform:translateY(-4px) rotateX(2deg);box-shadow:0 16px 28px rgba(35,45,80,.09)}.person .initial{width:43px;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#8e82f4,#5e50d8);color:#fff;font-weight:900}.person .info{min-width:0;flex:1}.person b,.person small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person small{color:var(--muted)}.delete{border:0;background:#fff0ed;color:#d34b37;width:33px;aspect-ratio:1;border-radius:10px;cursor:pointer}
    @keyframes float{50%{transform:translateY(-14px) rotateY(8deg)}}@media(max-width:850px){.hero{grid-template-columns:1fr;text-align:center}.hero p,.search{margin-left:auto;margin-right:auto}.universe{height:390px}.workspace{grid-template-columns:1fr}.contacts{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.shell{width:calc(100% - 24px)}.nav{height:70px}.hero{padding-top:36px}.hero h1{font-size:49px}.universe{height:330px}.sphere{width:170px}.avatar{width:44px;border-radius:14px}.tag{right:-52%}.contacts{grid-template-columns:1fr}.search{flex-direction:column}.search button{width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="shell nav"><div class="brand"><span class="logo"></span>NEXUS</div><span class="status offline" id="status"><span id="count">0</span> people · <span id="mode">connecting</span></span></header>
  <main>
    <section class="shell hero">
      <div><div class="eyebrow">Relationships, beautifully organized</div><h1>Your people.<br><span>One orbit.</span></h1><p>A refined contact space that makes every connection feel close, clear, and effortless to find.</p><div class="search"><input id="search" aria-label="Search contacts" placeholder="Search name or email…"><button type="button">Search network</button></div></div>
      <div class="universe" aria-label="3D contact network"><div class="sphere"><div class="orbit"></div><span class="avatar a1">AM</span><span class="avatar a2">SK</span><span class="avatar a3">JL</span><div class="tag">Network health<strong>98% strong</strong></div></div></div>
    </section>
    <section class="shell workspace">
      <aside class="panel"><h2>Add a connection</h2><form class="form" id="form"><input id="name" required maxlength="50" placeholder="Full name"><input id="email" required maxlength="80" type="email" placeholder="Email address"><input id="role" maxlength="50" placeholder="Role or company"><button class="add">Add to network</button></form></aside>
      <section class="panel"><h2>Your network</h2><div class="contacts" id="contacts"></div></section>
    </section>
  </main>
  <script>
    const seed=[{id:'demo-1',name:'Ava Morgan',email:'ava@northstar.co',role:'Product lead'},{id:'demo-2',name:'Samir Khan',email:'samir@atelier.dev',role:'Creative developer'},{id:'demo-3',name:'June Lee',email:'june@studio.one',role:'Design director'}];
    let people=[],online=false;const list=document.querySelector('#contacts'),search=document.querySelector('#search'),count=document.querySelector('#count'),status=document.querySelector('#status'),mode=document.querySelector('#mode');
    function cached(){try{return JSON.parse(localStorage.getItem('nexus-contacts'))||seed}catch{return seed}}
    function save(){localStorage.setItem('nexus-contacts',JSON.stringify(people))}
    function setMode(value){online=value;mode.textContent=value?'API connected':'offline mode';status.classList.toggle('offline',!value)}
    async function request(url,options){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options&&options.headers)}});const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed.');return data}
    function render(){const q=search.value.trim().toLowerCase(),shown=people.filter(p=>(p.name+' '+p.email+' '+p.role).toLowerCase().includes(q));list.replaceChildren();count.textContent=people.length;if(!shown.length){const e=document.createElement('div');e.className='empty';e.textContent='No connections found.';list.append(e);return}shown.forEach(p=>{const card=document.createElement('article');card.className='person';const av=document.createElement('span');av.className='initial';av.textContent=p.name.split(/\s+/).map(v=>v[0]).join('').slice(0,2).toUpperCase();const info=document.createElement('span');info.className='info';const name=document.createElement('b');name.textContent=p.name;const meta=document.createElement('small');meta.textContent=p.role+' · '+p.email;info.append(name,meta);const del=document.createElement('button');del.className='delete';del.type='button';del.setAttribute('aria-label','Delete '+p.name);del.textContent='×';del.onclick=async()=>{try{if(online)await request('/api/contacts/'+p.id,{method:'DELETE'});people=people.filter(x=>x.id!==p.id);save();render()}catch(error){alert(error.message)}};card.append(av,info,del);list.append(card)})}
    document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const input={name:document.querySelector('#name').value.trim(),email:document.querySelector('#email').value.trim(),role:document.querySelector('#role').value.trim()||'New connection'};try{const contact=online?(await request('/api/contacts',{method:'POST',body:JSON.stringify(input)})).contact:{id:crypto.randomUUID(),...input};people.unshift(contact);save();e.target.reset();render()}catch(error){alert(error.message)}};
    search.oninput=render;(async()=>{try{people=(await request('/api/contacts')).contacts;setMode(true)}catch{people=cached();setMode(false)}save();render()})();
  </script>
</body>
</html>
